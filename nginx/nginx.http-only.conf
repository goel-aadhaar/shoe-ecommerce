# HTTP-only reverse proxy — for the first boot, before TLS exists.
#
# Use this when you do not have a domain yet, or before running certbot:
#   docker compose -f docker-compose.prod.yml ... (edit the nginx volume to
#   mount this file instead of nginx.conf)
#
# Serves everything from one origin, exactly like the TLS config:
#   /        -> Next.js
#   /api/v1/ -> Express
# The Python AI service is intentionally absent; it is internal-only.
#
# Do not stay on this in production — passwords and JWTs would travel in clear
# text. Switch to nginx.conf as soon as a certificate is issued.

upstream frontend_upstream { server frontend:3000; }
upstream backend_upstream  { server backend:5000; }

server {
    listen 80;
    server_name _;

    # Keep the ACME path working so certbot can be run later without downtime.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 12m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    location /api/v1/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A copilot turn is several model round-trips; the app allows up to 75s.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Stripe signature verification needs the unmodified body.
        proxy_request_buffering off;
    }

    location /_next/static/ {
        proxy_pass http://frontend_upstream;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
