# ==========================================================================
# urban-sole — AI platform infrastructure
# Brings up the AI service, Celery worker, Qdrant, Redis, and (optional) Mongo.
# The existing Express backend and Next frontend keep their own run setup;
# point the backend's AI_SERVICE_URL at http://localhost:8000.
#
#   docker compose up -d qdrant redis mongo     # infra only
#   docker compose up --build ai-service worker # + the AI service
# ==========================================================================
name: urban-sole-ai

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Optional local Mongo. If you use MongoDB Atlas, skip this and set MONGO_URI in ai-service/.env.
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./ai-service/.env
    environment:
      # Container-network overrides (beat the .env defaults which target localhost)
      MONGO_URI: mongodb://mongo:27017
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      # Absolute path on the volume shared with the worker, which trains the model.
      ARTIFACTS_DIR: /artifacts
    volumes:
      # The worker writes the trained model here; the API reads it. Without this
      # shared volume each container has its own empty dir and the recommender
      # permanently falls back to popularity.
      - ai_artifacts:/artifacts
    ports:
      # Host 8001 -> container 8000. Port 8000 on this machine is already taken
      # by another project's container, so the AI service is published on 8001.
      - "8001:8000"
    depends_on:
      - qdrant
      - redis
      - mongo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  worker:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./ai-service/.env
    environment:
      MONGO_URI: mongodb://mongo:27017
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      ARTIFACTS_DIR: /artifacts
    volumes:
      - ai_artifacts:/artifacts
    command: ["celery", "-A", "app.workers.celery_app.celery", "worker", "--beat", "--loglevel=info"]
    depends_on:
      - redis
      - qdrant
      - mongo

volumes:
  qdrant_data:
  redis_data:
  mongo_data:
  ai_artifacts:
